name: Deploy API via FTP

on:
  push:
    branches: [main]
    paths:
      - 'src/Wros.Api/**'
      - 'global.json'
      - 'Wros.slnx'
      - '**/Directory.Build.*'
      - '**/Directory.Packages.props'
      - '**/[Nn]u[Gg]et.[Cc]onfig'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/Wros.Api/Wros.Api.csproj --locked-mode

      - name: Publish
        run: dotnet publish src/Wros.Api/Wros.Api.csproj --configuration Release --no-restore --output ./artifacts/api

      - name: Remove configuration from upload
        shell: pwsh
        run: |
          Get-ChildItem './artifacts/api' -Recurse -File |
            Where-Object { $_.Name -like 'appsettings*.json' } |
            Remove-Item -Force

      - name: Validate FTP destination
        shell: pwsh
        env:
          FTP_DIR: ${{ secrets.API_FTP_SERVER_DIR }}
        run: |
          $normalized = $env:FTP_DIR.Trim().Replace('\', '/').Trim('/')
          if ($normalized -ne 'api') {
            throw 'Invalid FTP destination. API_FTP_SERVER_DIR must point to /api/.'
          }
          "FTP_DEPLOY_DIR=./$normalized/" >> $env:GITHUB_ENV
          Write-Host 'FTP destination verified: ./api/'

      - name: Verify FTP Authentication
        shell: pwsh
        env:
          FTP_SERVER: ${{ secrets.API_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.API_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.API_FTP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:FTP_SERVER) -or
              [string]::IsNullOrWhiteSpace($env:FTP_USERNAME) -or
              [string]::IsNullOrWhiteSpace($env:FTP_PASSWORD)) {
            throw 'One or more FTP secrets are missing.'
          }
          if ($env:FTP_SERVER -match '[/\\:]') {
            throw 'API_FTP_SERVER must be a hostname only (no scheme, port, or path).'
          }

          Write-Host 'Testing plain FTP authentication and /api/ directory listing...'
          curl.exe --fail --silent --show-error `
            --connect-timeout 20 `
            --max-time 60 `
            --user "${env:FTP_USERNAME}:${env:FTP_PASSWORD}" `
            "ftp://${env:FTP_SERVER}:21/api/"

          if ($LASTEXITCODE -ne 0) {
            throw "FTP test failed (curl exit code $LASTEXITCODE)."
          }
          Write-Host 'FTP authentication and directory listing succeeded.'

      - name: Take API offline and release IIS file locks
        shell: pwsh
        env:
          FTP_SERVER: ${{ secrets.API_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.API_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.API_FTP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $offlineFile = Join-Path $env:RUNNER_TEMP 'app_offline.htm'
          Set-Content -Path $offlineFile -Encoding utf8 -Value '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>WROS maintenance</title></head><body><h1>WROS is being updated</h1><p>Please try again in a few minutes.</p></body></html>'
          $remoteDirectory = $env:FTP_DEPLOY_DIR -replace '^\./', ''
          curl.exe --fail --silent --show-error `
            --connect-timeout 20 --max-time 60 `
            --user "${env:FTP_USERNAME}:${env:FTP_PASSWORD}" `
            --upload-file "$offlineFile" `
            "ftp://${env:FTP_SERVER}:21/${remoteDirectory}app_offline.htm"
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not take the API offline. Application upload will not run.'
          }
          # ANCM's default shutdownTimeLimit is 10 seconds. Allow extra time
          # for shutdown and release of assemblies before touching application files.
          Write-Host 'Maintenance page uploaded. Waiting 30 seconds for IIS to release files...'
          Start-Sleep -Seconds 30

      - name: Deploy API
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.API_FTP_SERVER }}
          username: ${{ secrets.API_FTP_USERNAME }}
          password: ${{ secrets.API_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./artifacts/api/
          server-dir: ${{ env.FTP_DEPLOY_DIR }}
          timeout: 120000
          state-name: .wros-api-ftp-state.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/[Aa][Pp][Pp][Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss]*.[Jj][Ss][Oo][Nn]
            **/app_offline.htm
            **/logs/**
            **/uploads/**
            **/keys/**

      # Run only after a successful upload. Never restart a partially deployed API.
      - name: Bring API online
        shell: pwsh
        env:
          FTP_SERVER: ${{ secrets.API_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.API_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.API_FTP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $remoteDirectory = $env:FTP_DEPLOY_DIR -replace '^\./', ''
          curl.exe --fail --silent --show-error `
            --connect-timeout 20 --max-time 60 `
            --user "${env:FTP_USERNAME}:${env:FTP_PASSWORD}" `
            --quote "DELE /${remoteDirectory}app_offline.htm" `
            --list-only "ftp://${env:FTP_SERVER}:21/${remoteDirectory}"
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not remove app_offline.htm. Rerun deployment or remove it manually after verifying the upload completed.'
          }
          Write-Host 'Maintenance file removed. IIS can start the updated API on the next request.'

      - name: Report deployment failure or cancellation
        if: ${{ failure() || cancelled() }}
        shell: pwsh
        run: |
          'If app_offline.htm was uploaded, it is intentionally retained to prevent starting partially uploaded files. Rerun the complete deployment. Remove /api/app_offline.htm manually only after verifying or restoring a complete deployment.' >> $env:GITHUB_STEP_SUMMARY
